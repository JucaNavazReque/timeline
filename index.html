<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Publications Timeline</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main
        class="timeline"
        id="timeline"
        aria-label="Research publications timeline"
        tabindex="0"
      >
        <div class="timeline-track" id="timeline-track"></div>
      </main>
    </div>
    <div
      class="status-toast"
      id="status-toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
